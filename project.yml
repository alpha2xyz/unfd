name: AutoLang
options:
  bundleIdPrefix: com.alpha2xyz
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.2"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
targets:
  AutoLang:
    type: application
    platform: macOS
    sources:
      - path: AutoLang
    info:
      path: AutoLang/App/Info.plist
      properties:
        CFBundleDisplayName: "AutoLang"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        CFBundleDevelopmentRegion: en
        LSApplicationCategoryType: public.app-category.productivity
    entitlements:
      path: AutoLang/App/AutoLang.entitlements
      properties:
        com.apple.security.app-sandbox: false   # off on purpose: reading other apps through Accessibility needs it off
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alpha2xyz.autolang
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor   # app target only (Xcode 26+ default); tests stay nonisolated
        SWIFT_APPROACHABLE_CONCURRENCY: YES
  AutoLangTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: AutoLangTests
    dependencies:
      - target: AutoLang
schemes:
  AutoLang:
    build:
      targets:
        AutoLang: all
    test:
      targets:
        - AutoLangTests
